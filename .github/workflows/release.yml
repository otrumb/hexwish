name: draft-release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Exact v0.1.x tag already approved for publication
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.25.14
          check-latest: false
      - shell: bash
        run: |
          test "$(git describe --tags --exact-match)" = "${{ inputs.version }}"
          test "$(git rev-list -n 1 "${{ inputs.version }}")" = "${GITHUB_SHA}"
          mkdir dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-buildid=' -o dist/hexwish ./
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-buildid=' -o dist/hexwish.exe ./
          cp LICENSE README.md THIRD_PARTY_NOTICES.md dist/
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf hexwish-linux-amd64.tar.gz -C dist hexwish LICENSE README.md THIRD_PARTY_NOTICES.md
          zip -X -j hexwish-windows-amd64.zip dist/hexwish.exe dist/LICENSE dist/README.md dist/THIRD_PARTY_NOTICES.md
          sha256sum hexwish-linux-amd64.tar.gz hexwish-windows-amd64.zip > SHA256SUMS
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          draft: true
          tag_name: ${{ inputs.version }}
          files: |
            hexwish-linux-amd64.tar.gz
            hexwish-windows-amd64.zip
            SHA256SUMS
